# Root Worker config so Cloudflare "Workers Builds" (Git-connected CI) and
# `npx wrangler deploy` run from the repo root find the entry point.
# The entry imports config/, scripts/lib/, and src/ — wrangler bundles them.
#
# After the first deploy, add these in the Worker's
# Settings → Variables and Secrets:
#   GH_TOKEN  (Secret) — fine-grained PAT: Issues=RW, Contents=RW
#   GH_REPO   (Text)   — e.g. jeonck/ars   (use a PRIVATE repo for real PII)
#   ALLOW_ORIGIN (Text, optional) — e.g. https://jeonck.github.io

name = "ars-worker"
main = "worker/src/index.mjs"
compatibility_date = "2025-01-01"

# Non-secret vars live here so each `wrangler deploy` (Workers Builds) keeps
# them — dashboard-set plain vars not in this file get wiped on deploy.
# GH_TOKEN is a SECRET: set it in the dashboard / `wrangler secret put`, never here.
[vars]
GH_REPO = "jeonck/ars"
ALLOW_ORIGIN = "https://jeonck.github.io"
